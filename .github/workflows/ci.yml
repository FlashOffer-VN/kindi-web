name: CI - Kindi UI

on:
  push:
    branches:
      - production
      - testing
  pull_request:
    branches:
      - production
      - testing

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
        env:
          ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint || echo "No lint script found"

      - name: Run tests
        run: npm run test:ci || echo "No test script found"

      - name: Check SSR route coverage
        run: node scripts/check-server-routes.mjs

      - name: Check browser-global SSR safety
        run: node scripts/check-browser-globals.mjs

      - name: Build project (prerender)
        run: npm run build:production

      - name: Smoke-test prerendered output
        run: node scripts/smoke-prerender.mjs

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: kindi-ui-build
          path: dist/

      - name: Deploy to Vercel
        if: github.ref == 'refs/heads/production' && env.VERCEL_TOKEN != ''
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npx vercel deploy --prod --token "$VERCEL_TOKEN" --yes