<!-- shared/components/layouts/admin-layout/admin-header/admin-header.component.html -->
<header class="bg-white shadow-sm px-6 py-4 flex items-center justify-between">
    <!-- Left -->
    <div class="flex items-center gap-4">
        <button (click)="onToggleSidebar()" class="text-secondary hover:text-primary transition text-xl">
            <i class="fa-solid fa-bars"></i>
        </button>

        <a routerLink="/" class="flex items-center gap-2">
            <img [src]="logoPath" alt="Kindi" class="h-10 w-auto">
            <span class="text-xl font-bold text-secondary hidden sm:block">Kindi</span>
        </a>
    </div>

    <!-- Right -->
    <div class="flex items-center gap-4">
        <!-- Tạm ẩn chuông thông báo ở trang quản trị (chưa cần); giữ lại để dùng cho phía người dùng sau.
        <button class="text-gray-400 hover:text-secondary transition text-lg relative">
            <i class="fa-regular fa-bell"></i>
            <span class="absolute -top-1 -right-1 w-2 h-2 bg-danger rounded-full"></span>
        </button>
        -->

        <div class="flex items-center gap-2">
            <div
                class="w-8 h-8 rounded-full bg-primary text-white flex items-center justify-center text-sm font-medium">
                {{ userInitial }}
            </div>
            <span class="text-secondary text-sm hidden sm:block">{{ userName }}</span>
        </div>
    </div>
</header>
